<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Interactive HUD Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; max-width: 600px; text-align: center; }
        .demo-box {
            width: 90%;
            max-width: 700px;
            height: 350px;
            background: #090d16;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: crosshair;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .eye-track {
            width: 70px;
            height: 70px;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .pupil {
            width: 22px;
            height: 22px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            transition: transform 0.05s linear;
        }
        .mirror-plane {
            width: 240px;
            height: 75px;
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #94a3b8;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #38bdf8;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.05s linear;
        }
        .coords { margin-top: 15px; font-family: monospace; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>Aion Drive-Eye v1.1.0</h1>
    <p>Biometrikus járműfelügyeleti és ergonómiai kutatás – Interaktív Szemkövető Tükör Szimuláció (Talon-protocol)</p>

    <div class="demo-box" id="demoBox">
        <div class="eye-track">
            <div class="pupil" id="pupil"></div>
        </div>
        <div class="mirror-plane" id="mirror">
            AION MIRROR HUD [v1.1.0]
        </div>
        <div class="coords" id="coords">Tekintet pozíció: X: 0, Y: 0</div>
    </div>

    <script>
        const demoBox = document.getElementById('demoBox');
        const pupil = document.getElementById('pupil');
        const mirror = document.getElementById('mirror');
        const coords = document.getElementById('coords');

        demoBox.addEventListener('mousemove', (e) => {
            const rect = demoBox.getBoundingClientRect();
            const x = e.clientX - rect.left - (rect.width / 2);
            const y = e.clientY - rect.top - (rect.height / 2);

            const pupilX = Math.max(-20, Math.min(20, x / 12));
            const pupilY = Math.max(-20, Math.min(20, y / 12));
            pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;

            const rotateY = (x / rect.width) * 45;
            const rotateX = -(y / rect.height) * 35;
            mirror.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            coords.innerText = `X: ${Math.round(x)}, Y: ${Math.round(y)} | Mirror Yaw: ${Math.round(rotateY)}°, Pitch: ${Math.round(rotateX)}°`;
        });

        demoBox.addEventListener('mouseleave', () => {
            pupil.style.transform = 'translate(0px, 0px)';
            mirror.style.transform = 'perspective(500px) rotateX(0deg) rotateY(0deg)';
            coords.innerText = 'Tekintet pozíció: X: 0, Y: 0';
        });
    </script>
</body>
</html>
