<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Advanced HUD Simulator</title>
    <style>
        :root {
            --bg-color: #030712;
            --cyan-glow: #00f3ff;
            --blue-accent: #3b82f6;
            --panel-bg: rgba(15, 23, 42, 0.75);
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--cyan-glow);
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .cockpit-view {
            width: 95%;
            max-width: 750px;
            height: 420px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            box-sizing: border-box;
        }

        .hud-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--cyan-glow);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 8px;
        }

        .eye-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .eye-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .eye-track {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--cyan-glow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffffff 0%, var(--cyan-glow) 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--cyan-glow);
            transition: transform 0.04s ease-out;
        }

        .mirror-housing {
            perspective: 800px;
            margin-bottom: 10px;
        }

        .mirror-frame {
            width: 280px;
            height: 85px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid var(--cyan-glow);
            border-radius: 12px 12px 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.3);
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            position: relative;
        }

        .mirror-glass {
            width: 92%;
            height: 80%;
            background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.15) 0%, rgba(15, 23, 42, 0.9) 100%);
            border-radius: 8px 8px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .mirror-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--cyan-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .mirror-status {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .telemetry-panel {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 8px;
            padding: 8px 15px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--cyan-glow);
        }

        .telemetry-item { display: flex; justify-content: space-between; }
        .val { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <div class="subtitle">Biometrikus Szemkövető & Intelligens Tükör-Vezérlő [Talon-Protocol]</div>
    </div>

    <div class="cockpit-view" id="cockpit">
        <div class="hud-top-bar">
            <span>SYS.STATUS: ONLINE</span>
            <span>AION MATRIX LABS</span>
            <span>MODE: TRACKING</span>
        </div>

        <div class="eye-container">
            <div class="eye-label">BIOMETRIC EYE SENSOR</div>
            <div class="eye-track">
                <div class="pupil" id="pupil"></div>
            </div>
        </div>

        <div class="mirror-housing">
            <div class="mirror-frame" id="mirror">
                <div class="mirror-glass">
                    <div class="mirror-title">AION MIRROR HUD</div>
                    <div class="mirror-status" id="mirrorStatus">AUTONOMOUS ADJUSTMENT</div>
                </div>
            </div>
        </div>

        <div class="telemetry-panel">
            <div class="telemetry-item"><span>EYE POS (X,Y):</span> <span class="val" id="eyeCoords">0, 0</span></div>
            <div class="telemetry-item"><span>MIRROR YAW:</span> <span class="val" id="yawVal">0.0°</span></div>
            <div class="telemetry-item"><span>BLINDSPOT RISK:</span> <span class="val" id="riskVal" style="color: #4ade80;">LOW (0%)</span></div>
            <div class="telemetry-item"><span>MIRROR PITCH:</span> <span class="val" id="pitchVal">0.0°</span></div>
        </div>
    </div>

    <script>
        const cockpit = document.getElementById('cockpit');
        const pupil = document.getElementById('pupil');
        const mirror = document.getElementById('mirror');
        const eyeCoords = document.getElementById('eyeCoords');
        const yawVal = document.getElementById('yawVal');
        const pitchVal = document.getElementById('pitchVal');
        const riskVal = document.getElementById('riskVal');

        cockpit.addEventListener('mousemove', (e) => {
            const rect = cockpit.getBoundingClientRect();
            const x = e.clientX - rect.left - (rect.width / 2);
            const y = e.clientY - rect.top - (rect.height / 2);

            // Szembogár finomhangolt elmozdulása
            const pupilX = Math.max(-22, Math.min(22, x / 12));
            const pupilY = Math.max(-22, Math.min(22, y / 12));
            pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;

            // Tükör dőlésszög-fizikája (3D Real-time Yaw & Pitch)
            const yaw = (x / (rect.width / 2)) * 35;
            const pitch = -(y / (rect.height / 2)) * 25;
            mirror.style.transform = `rotateY(${yaw}deg) rotateX(${pitch}deg)`;

            // Telemetria és vakfolt kockázat számítás
            const risk = Math.min(100, Math.round((Math.abs(x) + Math.abs(y)) / 4));
            
            eyeCoords.innerText = `${Math.round(x)}, ${Math.round(y)}`;
            yawVal.innerText = `${yaw.toFixed(1)}°`;
            pitchVal.innerText = `${pitch.toFixed(1)}°`;
            
            riskVal.innerText = `${risk < 40 ? 'LOW' : risk < 75 ? 'MEDIUM' : 'HIGH'} (${risk}%)`;
            riskVal.style.color = risk < 40 ? '#4ade80' : risk < 75 ? '#facc15' : '#f87171';
        });

        cockpit.addEventListener('mouseleave', () => {
            pupil.style.transform = 'translate(0px, 0px)';
            mirror.style.transform = 'rotateY(0deg) rotateX(0deg)';
            eyeCoords.innerText = '0, 0';
            yawVal.innerText = '0.0°';
            pitchVal.innerText = '0.0°';
            riskVal.innerText = 'LOW (0%)';
            riskVal.style.color = '#4ade80';
        });
    </script>
</body>
</html>
