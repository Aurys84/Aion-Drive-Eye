<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Real-World Mirror Simulator</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --bg-dark: #090d16;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }

        .header { text-align: center; margin-bottom: 10px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.5rem; text-shadow: 0 0 10px var(--hud-cyan); }
        p { color: #94a3b8; font-size: 0.8rem; margin-top: 4px; }

        /* JÁRMŰ KABIN SZIMULÁCIÓ */
        .cabin-view {
            width: 100%;
            max-width: 680px;
            height: 420px;
            background: radial-gradient(circle at 50% 100%, #1e293b 0%, #020617 80%);
            border: 2px solid #334155;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* SZÉLVEDŐ HUD KIJELZŐ (ZÖLD ANGLES) */
        .windshield-hud {
            position: absolute;
            top: 25px;
            right: 35px;
            font-family: monospace;
            color: var(--hud-green);
            font-size: 0.9rem;
            text-align: right;
            text-shadow: 0 0 8px var(--hud-green);
            pointer-events: none;
            line-height: 1.4;
        }

        /* FIX KÜLSŐ TÜKÖRHÁZ */
        .mirror-housing {
            width: 280px;
            height: 110px;
            background: #020617;
            border: 4px solid #1e293b;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px #000, 0 10px 25px rgba(0,0,0,0.7);
            margin-top: 20px;
        }

        /* MOZGÓ BELSŐ TÜKÖRKÉP */
        .mirror-inner-glass {
            width: 130%;
            height: 130%;
            position: absolute;
            top: -15%;
            left: -15%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,243,255,0.15), transparent 60%),
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.03s ease-out;
        }

        /* USER VERIFIED TÁRGYI KERET A TÜKÖRBEN */
        .target-reticle {
            width: 140px;
            height: 60px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(0,243,255,0.3);
            text-transform: lowercase;
        }

        /* ALSÓ BEÁLLÍTÁSI STATUS HUD */
        .mirror-adjust-hud {
            position: absolute;
            bottom: 20px;
            left: 30px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--hud-cyan);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(0,243,255,0.2);
        }

        .status-icon {
            width: 24px;
            height: 16px;
            background: var(--hud-cyan);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>Valós idejű Optikai Szögtükrözés & HUD Szimuláció</p>
    </div>

    <div class="cabin-view" id="cabin">
        
        <!-- SZÉLVEDŐ HUD DISPLAY (KÉPEK ALAPJÁN) -->
        <div class="windshield-hud">
            <div>L-ANG: <span id="langVal">15°</span></div>
            <div>R-ANG: <span id="rangVal">18°</span></div>
        </div>

        <!-- FIX TÜKÖRHÁZ A MOZGÓ BELSŐ ÜVEGGEL -->
        <div class="mirror-housing">
            <div class="mirror-inner-glass" id="mirrorGlass">
                <div class="target-reticle" id="reticle">
                    user verified
                </div>
            </div>
        </div>

        <!-- LOWER ADJUSTMENT PANEL (KÉPEK ALAPJÁN) -->
        <div class="mirror-adjust-hud">
            <div class="status-icon"></div>
            <div>
                <div>Current: <span id="currVal">15°</span></div>
                <div>Target: <span id="targVal">18°</span></div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const currVal = document.getElementById('currVal');
        const targVal = document.getElementById('targVal');

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            // Kizárólag a belső tükörkép mozdul el a kereten belül!
            const shiftX = (x / (rect.width / 2)) * 25;
            const shiftY = (y / (rect.height / 2)) * 18;
            mirrorGlass.style.transform = `translate(${shiftX}px, ${shiftY}px)`;

            // Szögértékek dinamikus változása a tekintet alapján
            const currentAng = Math.round(15 + (x / 30));
            const targetAng = Math.round(18 + (y / 30));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            targVal.innerText = `${targetAng}°`;

            if (Math.abs(x) < 40 && Math.abs(y) < 40) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
