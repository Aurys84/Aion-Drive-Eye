<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Perfect Restore</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --hud-amber: #f59e0b;
            --hud-red: #ef4444;
            --hud-blue: #3b82f6;
            --bg-dark: #030712;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 5px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.5rem; text-shadow: 0 0 15px var(--hud-cyan); letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 0.8rem; margin: 2px 0; }

        .cockpit-container {
            position: relative;
            width: 100%;
            max-width: 980px;
            height: 570px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        .side-mirror-container {
            position: absolute;
            top: 140px;
            width: 170px;
            height: 120px;
            perspective: 600px;
            z-index: 20;
        }

        .side-mirror-left-pos { left: -10px; }
        .side-mirror-right-pos { right: -10px; }

        .side-mirror-housing {
            width: 100%;
            height: 100%;
            background: #000;
            border: 3px solid var(--hud-cyan);
            border-radius: 28px;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('Ball tükör terv.png');
            background-size: 350%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .side-mirror-container.side-mirror-right-pos .side-mirror-housing {
            background-image: url('Jobb tükör terv.png');
            background-size: 350%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .mirror-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.04s ease-out;
        }

        /* SZÉLVEDŐ KILÁTÁS */
        .windshield-frame {
            width: 82%;
            height: 100%;
            background: linear-gradient(180deg, #090d16 0%, #111827 50%, #030712 100%);
            border: 3px solid rgba(0, 243, 255, 0.6);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,243,255,0.25);
        }

        .road-perspective {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
            background: #0d1527;
            border-top: 2px solid var(--hud-cyan);
        }

        .road-lane {
            width: 280px;
            height: 200%;
            border-left: 8px dashed rgba(255,255,255,0.7);
            border-right: 8px dashed rgba(255,255,255,0.7);
            transform: perspective(300px) rotateX(65deg);
            animation: moveRoad 0.35s linear infinite;
        }

        @keyframes moveRoad {
            0% { transform: perspective(300px) rotateX(65deg) translateY(0); }
            100% { transform: perspective(300px) rotateX(65deg) translateY(50px); }
        }

        .smart-windshield-hud {
            position: absolute;
            width: 92%;
            top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }

        .led-cluster {
            display: flex;
            gap: 8px;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.5);
            padding: 6px 12px;
            border-radius: 12px;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,243,255,0.3);
        }

        .led { font-size: 0.9rem; filter: drop-shadow(0 0 5px currentColor); }
        .led-green { color: var(--hud-green); }
        .led-amber { color: var(--hud-amber); }
        .led-red { color: var(--hud-red); }
        .led-blue { color: var(--hud-blue); }

        .speedo-display {
            color: var(--hud-cyan);
            font-size: 1.1rem;
            font-weight: bold;
            margin-left: 10px;
            text-shadow: 0 0 8px var(--hud-cyan);
        }

        .angle-hud {
            color: var(--hud-green);
            font-size: 0.95rem;
            font-weight: bold;
            text-align: right;
            background: rgba(2, 6, 23, 0.85);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            text-shadow: 0 0 8px var(--hud-green);
        }

        .mirror-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 15;
            margin-top: 5px;
        }

        .mirror-housing-center {
            width: 350px;
            height: 110px;
            background: #000;
            border: 3px solid var(--hud-cyan);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            perspective: 700px;
            z-index: 2;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
            background-image: url('Középső tükör terv.png');
            background-size: 320%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .mirror-inner-glass {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .target-reticle {
            position: absolute;
            z-index: 5;
            width: 150px;
            height: 55px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            background: rgba(2, 6, 23, 0.75);
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
        }

        .head-tracker-stage {
            width: 120px;
            height: 110px;
            perspective: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            margin-bottom: 5px;
        }

        .head-3d {
            width: 75px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #0f172a);
            border: 2px solid var(--hud-cyan);
            border-radius: 40px 40px 50px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            box-shadow: 0 0 20px rgba(0,243,255,0.3);
        }

        .eye-sensor {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 3px solid var(--hud-cyan);
            border-radius: 50%;
            position: absolute;
            top: 30px;
            transition: transform 0.04s ease-out;
            box-shadow: 0 0 10px var(--hud-cyan);
        }

        .eye-left { left: 16px; }
        .eye-right { right: 16px; }

        .pupil-3d {
            width: 7px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .mirror-adjust-hud {
            position: absolute;
            bottom: 15px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 8px 14px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,243,255,0.25);
        }

        .status-icon {
            width: 24px;
            height: 14px;
            background: var(--hud-cyan);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>AION Matrix Lab - Perfect Restore</p>
    </div>

    <div class="cockpit-container">

        <!-- BAL KÜLSŐ TÜKÖR -->
        <div class="side-mirror-container side-mirror-left-pos">
            <div class="side-mirror-housing" id="leftMirrorHousing">
                <div class="mirror-canvas" id="leftMirrorContent"></div>
            </div>
        </div>

        <div class="windshield-frame" id="cabin">
            
            <div class="road-perspective">
                <div class="road-lane"></div>
            </div>

            <div class="smart-windshield-hud">
                <div class="led-cluster">
                    <span class="led led-green">⬅️</span>
                    <span class="led led-blue">🔷</span>
                    <span class="led led-green">➡️</span>
                    <span class="led led-amber">⚠️</span>
                    <span class="led led-red">🛢️</span>
                    <span class="led led-red">🔋</span>
                    <span class="led led-red">🛑</span>
                    <span class="speedo-display"><span id="speedVal">90</span> KM/H</span>
                </div>
                <div class="angle-hud">
                    <div>L-ANG: <span id="langVal">15°</span></div>
                    <div>R-ANG: <span id="rangVal">18°</span></div>
                </div>
            </div>

            <!-- KÖZÉPSŐ TÜKÖR -->
            <div class="mirror-wrapper">
                <div class="mirror-housing-center" id="centerMirrorHousing">
                    <div class="mirror-inner-glass" id="mirrorGlass">
                        <div class="mirror-canvas" id="centerMirrorContent"></div>
                        <div class="target-reticle" id="reticle">
                            user verified
                        </div>
                    </div>
                </div>
            </div>

            <div class="head-tracker-stage">
                <div class="head-3d" id="head3d">
                    <div class="eye-sensor eye-left"><div class="pupil-3d" id="pupilL"></div></div>
                    <div class="eye-sensor eye-right"><div class="pupil-3d" id="pupilR"></div></div>
                </div>
            </div>

            <div class="mirror-adjust-hud">
                <div class="status-icon"></div>
                <div>
                    <div>Current: <span id="currVal">15°</span></div>
                    <div>Target: <span id="targVal">18°</span></div>
                </div>
            </div>

        </div>

        <!-- JOBB KÜLSŐ TÜKÖR -->
        <div class="side-mirror-container side-mirror-right-pos">
            <div class="side-mirror-housing" id="rightMirrorHousing">
                <div class="mirror-canvas" id="rightMirrorContent"></div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const head3d = document.getElementById('head3d');
        const pupilL = document.getElementById('pupilL');
        const pupilR = document.getElementById('pupilR');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const centerMirrorHousing = document.getElementById('centerMirrorHousing');
        const centerMirrorContent = document.getElementById('centerMirrorContent');
        const leftMirrorHousing = document.getElementById('leftMirrorHousing');
        const rightMirrorHousing = document.getElementById('rightMirrorHousing');
        const leftMirrorContent = document.getElementById('leftMirrorContent');
        const rightMirrorContent = document.getElementById('rightMirrorContent');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const currVal = document.getElementById('currVal');
        const targVal = document.getElementById('targVal');
        const speedVal = document.getElementById('speedVal');

        let speed = 90;
        setInterval(() => {
            speed = 88 + Math.floor(Math.random() * 5);
            speedVal.innerText = speed;
        }, 1500);

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            const headRotY = (x / (rect.width / 2)) * 35;
            const headRotX = -(y / (rect.height / 2)) * 25;
            head3d.style.transform = `rotateY(${headRotY}deg) rotateX(${headRotX}deg)`;

            const px = (x / (rect.width / 2)) * 5;
            const py = (y / (rect.height / 2)) * 5;
            pupilL.style.transform = `translate(${px}px, ${py}px)`;
            pupilR.style.transform = `translate(${px}px, ${py}px)`;

            const rotY = (x / (rect.width / 2)) * 30;
            const rotX = -(y / (rect.height / 2)) * 24;
            const shiftX = (x / (rect.width / 2)) * 14;

            mirrorGlass.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateX(${shiftX}px)`;
            centerMirrorHousing.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;

            leftMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;
            rightMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;

            const currentAng = Math.round(15 + (x / 22));
            const targetAng = Math.round(18 + (y / 22));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            targVal.innerText = `${targetAng}°`;

            if (Math.abs(x) < 60 && Math.abs(y) < 60) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
