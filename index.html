<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Matrix Vision 3D HUD</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --bg-dark: #030712;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 12px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.8rem; text-shadow: 0 0 15px var(--hud-cyan); letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

        /* KABIN ÉS KIJELZŐ FELNAGYÍTVA A MAXIMÁLIS LÁTVÁNYÉRT */
        .cabin-view {
            width: 98%;
            max-width: 850px;
            height: 520px;
            background: radial-gradient(circle at 50% 100%, #1e293b 0%, #020617 85%);
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0,243,255,0.15);
        }

        /* ZÖLD HUD DŐLÉSSZÖG ADATOK A SZÉLVEDŐN */
        .windshield-hud {
            position: absolute;
            top: 25px;
            right: 35px;
            font-family: monospace;
            color: var(--hud-green);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: right;
            text-shadow: 0 0 10px var(--hud-green);
            pointer-events: none;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        /* FELNAGYÍTOTT FIX TÜKÖRHÁZ PERSPEKTÍVA TÉRREL */
        .mirror-housing {
            width: 380px;
            height: 155px;
            background: #020617;
            border: 5px solid #1e293b;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px #000, 0 15px 35px rgba(0,0,0,0.85);
            margin-top: 25px;
            perspective: 700px;
        }

        /* 3D-BEN DŐLŐ ÉS TÉRBE KIEMELKEDŐ BELSŐ TÜKÖRÜVEG */
        .mirror-inner-glass {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,243,255,0.25), transparent 65%),
                linear-gradient(rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* USER VERIFIED TÁRGYI KERET A TÜKÖRBEN (3D Z-AXIS DRIFT) */
        .target-reticle {
            width: 190px;
            height: 85px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
            text-transform: lowercase;
            transform: translateZ(30px);
        }

        /* FELNAGYÍTOTT ALSÓ BEÁLLÍTÁSI STATUS HUD */
        .mirror-adjust-hud {
            position: absolute;
            bottom: 25px;
            left: 35px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 10px 18px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0,243,255,0.25);
        }

        .status-icon {
            width: 28px;
            height: 18px;
            background: var(--hud-cyan);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>AION Matrix Lab - Autonomous 3D Optical Mirror Simulator</p>
    </div>

    <div class="cabin-view" id="cabin">
        
        <div class="windshield-hud">
            <div>L-ANG: <span id="langVal">15°</span></div>
            <div>R-ANG: <span id="rangVal">18°</span></div>
        </div>

        <div class="mirror-housing">
            <div class="mirror-inner-glass" id="mirrorGlass">
                <div class="target-reticle" id="reticle">
                    user verified
                </div>
            </div>
        </div>

        <div class="mirror-adjust-hud">
            <div class="status-icon"></div>
            <div>
                <div>Current: <span id="currVal">15°</span></div>
                <div>Target: <span id="targVal">18°</span></div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const currVal = document.getElementById('currVal');
        const targVal = document.getElementById('targVal');

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            // Dinamikus 3D dőlésszög- és elmozdulás számítás
            const rotY = (x / (rect.width / 2)) * 30;
            const rotX = -(y / (rect.height / 2)) * 24;
            const shiftX = (x / (rect.width / 2)) * 14;

            mirrorGlass.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateX(${shiftX}px)`;

            const currentAng = Math.round(15 + (x / 22));
            const targetAng = Math.round(18 + (y / 22));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            targVal.innerText = `${targetAng}°`;

            if (Math.abs(x) < 60 && Math.abs(y) < 60) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
                reticle.style.boxShadow = "0 0 20px rgba(0,243,255,0.6)";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
                reticle.style.boxShadow = "0 0 15px rgba(34,197,94,0.4)";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
