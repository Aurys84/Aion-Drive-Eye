<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Professional Cockpit & HUD</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --hud-amber: #f59e0b;
            --hud-red: #ef4444;
            --hud-blue: #3b82f6;
            --bg-dark: #030712;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 5px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.5rem; text-shadow: 0 0 15px var(--hud-cyan); letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 0.8rem; margin: 2px 0; }

        .cockpit-container {
            position: relative;
            width: 100%;
            max-width: 980px;
            height: 570px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        /* 3D-BEN DŐLŐ VALÓDI KÜLSŐ TÜKRÖK */
        .side-mirror-container {
            position: absolute;
            top: 140px;
            width: 110px;
            height: 140px;
            perspective: 600px;
            z-index: 20;
        }

        .side-mirror-left-pos { left: -10px; }
        .side-mirror-right-pos { right: -10px; }

        .side-mirror-housing {
            width: 100%;
            height: 100%;
            background: #020617;
            border: 4px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9), inset 0 0 15px #000;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-shape { border-radius: 24px 10px 10px 35px; border-left: 4px solid var(--hud-cyan); }
        .right-shape { border-radius: 10px 24px 35px 10px; border-right: 4px solid var(--hud-cyan); }

        .side-mirror-glass {
            width: 90%;
            height: 90%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-image: radial-gradient(circle at 50% 50%, rgba(0,243,255,0.25), transparent 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--hud-cyan);
            font-weight: bold;
        }

        /* SZÉLVEDŐ ÉS UTAS TÉR */
        .windshield-frame {
            width: 82%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 20%, rgba(255, 230, 200, 0.15) 0%, #020617 95%),
                linear-gradient(180deg, #020617 0%, #0f172a 60%, #050b14 100%);
            border: 3px solid rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,243,255,0.15);
        }

        .road-perspective {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
        }

        .road-lane {
            width: 240px;
            height: 100%;
            border-left: 6px dashed rgba(255, 255, 255, 0.35);
            border-right: 6px dashed rgba(255, 255, 255, 0.35);
            transform: perspective(300px) rotateX(65deg);
        }

        /* OKOSSZÉLVEDŐ HUD MŰSZERFAL & TELJES LED KÉSZLET */
        .smart-windshield-hud {
            position: absolute;
            width: 92%;
            top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }

        .led-cluster {
            display: flex;
            gap: 8px;
            background: rgba(2, 6, 23, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 6px 12px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,243,255,0.2);
            align-items: center;
        }

        .led { font-size: 0.9rem; filter: drop-shadow(0 0 5px currentColor); }
        .led-green { color: var(--hud-green); }
        .led-amber { color: var(--hud-amber); }
        .led-red { color: var(--hud-red); }
        .led-blue { color: var(--hud-blue); }

        .speedo-display {
            color: var(--hud-cyan);
            font-size: 1.1rem;
            font-weight: bold;
            margin-left: 10px;
            text-shadow: 0 0 10px var(--hud-cyan);
        }

        .angle-hud {
            color: var(--hud-green);
            font-size: 0.95rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--hud-green);
            text-align: right;
            line-height: 1.4;
        }

        /* KÖZÉPSŐ BELSŐ TÜKÖR */
        .mirror-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 15;
            margin-top: 5px;
        }

        .mirror-stem {
            width: 16px;
            height: 25px;
            background: linear-gradient(90deg, #0f172a, #334155, #0f172a);
            border: 1px solid #475569;
            box-shadow: 0 0 10px #000;
            border-radius: 4px;
            margin-bottom: -5px;
            z-index: 1;
        }

        .mirror-housing {
            width: 360px;
            height: 130px;
            background: #020617;
            border: 5px solid #1e293b;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px #000, 0 15px 35px rgba(0,0,0,0.85);
            perspective: 700px;
            z-index: 2;
        }

        .mirror-inner-glass {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,243,255,0.25), transparent 65%),
                linear-gradient(rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .target-reticle {
            width: 180px;
            height: 70px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
            text-transform: lowercase;
            transform: translateZ(30px);
        }

        /* 3D BIOMETRIKUS FEJ / TEKINTET */
        .head-tracker-stage {
            width: 120px;
            height: 110px;
            perspective: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            margin-bottom: 5px;
        }

        .head-3d {
            width: 75px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #0f172a);
            border: 2px solid var(--hud-cyan);
            border-radius: 40px 40px 50px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
        }

        .eye-sensor {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 3px solid var(--hud-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--hud-cyan);
            position: absolute;
            top: 30px;
            transition: transform 0.04s ease-out;
        }

        .eye-left { left: 16px; }
        .eye-right { right: 16px; }

        .pupil-3d {
            width: 7px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .mirror-adjust-hud {
            position: absolute;
            bottom: 15px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 8px 14px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,243,255,0.25);
            z-index: 10;
        }

        .status-icon {
            width: 24px;
            height: 14px;
            background: var(--hud-cyan);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>AION Matrix Lab - Professional Cockpit & Full LED HUD</p>
    </div>

    <div class="cockpit-container">

        <!-- 3D BAL OLDALI TÜKÖR (DOBOZON KÍVÜL) -->
        <div class="side-mirror-container side-mirror-left-pos">
            <div class="side-mirror-housing left-shape" id="leftMirrorHousing">
                <div class="side-mirror-glass">
                    <span>L-MIRROR</span>
                    <span id="lMirrorAng">15°</span>
                </div>
            </div>
        </div>

        <!-- SZÉLVEDŐ KABIN -->
        <div class="windshield-frame" id="cabin">
            
            <div class="road-perspective">
                <div class="road-lane"></div>
            </div>

            <!-- OKOSSZÉLVEDŐ HUD MŰSZERFAL LÁMPÁKAL & FÜGGETLEN SEBESSÉGMÉRŐVEL -->
            <div class="smart-windshield-hud">
                <div class="led-cluster">
                    <span class="led led-green" title="Index Bal">⬅️</span>
                    <span class="led led-blue" title="Távolsági fényszóró">🔷</span>
                    <span class="led led-green" title="Index Jobb">➡️</span>
                    <span class="led led-amber" title="Check Engine">⚠️</span>
                    <span class="led led-red" title="Olajnyomás">🛢️</span>
                    <span class="led led-red" title="Akkumulátor">🔋</span>
                    <span class="led led-red" title="Kézifék / ABS">🛑</span>
                    <span class="speedo-display"><span id="speedVal">90</span> KM/H</span>
                </div>
                <div class="angle-hud">
                    <div>L-ANG: <span id="langVal">15°</span></div>
                    <div>R-ANG: <span id="rangVal">18°</span></div>
                </div>
            </div>

            <!-- KÖZÉPSŐ TÜKÖR -->
            <div class="mirror-wrapper">
                <div class="mirror-stem"></div>
                <div class="mirror-housing">
                    <div class="mirror-inner-glass" id="mirrorGlass">
                        <div class="target-reticle" id="reticle">
                            user verified
                        </div>
                    </div>
                </div>
            </div>

            <!-- BIOMETRIKUS FEJ / TEKINTET TRACKER -->
            <div class="head-tracker-stage">
                <div class="head-3d" id="head3d">
                    <div class="eye-sensor eye-left"><div class="pupil-3d" id="pupilL"></div></div>
                    <div class="eye-sensor eye-right"><div class="pupil-3d" id="pupilR"></div></div>
                </div>
            </div>

            <div class="mirror-adjust-hud">
                <div class="status-icon"></div>
                <div>
                    <div>Current: <span id="currVal">15°</span></div>
                    <div>Target: <span id="targVal">18°</span></div>
                </div>
            </div>

        </div>

        <!-- 3D JOBB OLDALI TÜKÖR (DOBOZON KÍVÜL) -->
        <div class="side-mirror-container side-mirror-right-pos">
            <div class="side-mirror-housing right-shape" id="rightMirrorHousing">
                <div class="side-mirror-glass">
                    <span>R-MIRROR</span>
                    <span id="rMirrorAng">18°</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const head3d = document.getElementById('head3d');
        const pupilL = document.getElementById('pupilL');
        const pupilR = document.getElementById('pupilR');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const leftMirrorHousing = document.getElementById('leftMirrorHousing');
        const rightMirrorHousing = document.getElementById('rightMirrorHousing');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const lMirrorAng = document.getElementById('lMirrorAng');
        const rMirrorAng = document.getElementById('rMirrorAng');
        const currVal = document.getElementById('currVal');
        const targVal = document.getElementById('targVal');
        const speedVal = document.getElementById('speedVal');

        // Független sebesség szimuláció (nem a szemre reagál)
        let speed = 90;
        setInterval(() => {
            speed = 88 + Math.floor(Math.random() * 5);
            speedVal.innerText = speed;
        }, 1500);

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            // 1. 3D FEJ ÉS TEKINTET
            const headRotY = (x / (rect.width / 2)) * 35;
            const headRotX = -(y / (rect.height / 2)) * 25;
            head3d.style.transform = `rotateY(${headRotY}deg) rotateX(${headRotX}deg)`;

            const px = (x / (rect.width / 2)) * 5;
            const py = (y / (rect.height / 2)) * 5;
            pupilL.style.transform = `translate(${px}px, ${py}px)`;
            pupilR.style.transform = `translate(${px}px, ${py}px)`;

            // 2. KÖZÉPSŐ TÜKÖR 3D
            const rotY = (x / (rect.width / 2)) * 30;
            const rotX = -(y / (rect.height / 2)) * 24;
            const shiftX = (x / (rect.width / 2)) * 14;
            mirrorGlass.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateX(${shiftX}px)`;

            // 3. KÜLSŐ TÜKRÖK VALÓDI 3D DŐLÉSE A TÉRBEN
            leftMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;
            rightMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;

            // 4. TELEMETRIA
            const currentAng = Math.round(15 + (x / 22));
            const targetAng = Math.round(18 + (y / 22));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            lMirrorAng.innerText = `${currentAng}°`;
            rMirrorAng.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            targVal.innerText = `${targetAng}°`;

            if (Math.abs(x) < 60 && Math.abs(y) < 60) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
