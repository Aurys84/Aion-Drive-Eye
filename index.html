<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Crystal HUD 2</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --hud-amber: #f59e0b;
            --hud-red: #ef4444;
            --hud-blue: #3b82f6;
            --bg-dark: #030712;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 5px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.5rem; text-shadow: 0 0 15px var(--hud-cyan); letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 0.8rem; margin: 2px 0; }

        .cockpit-container {
            position: relative;
            width: 100%;
            max-width: 980px;
            height: 590px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 800px;
        }

        .side-mirror-container {
            position: absolute;
            top: 130px;
            width: 170px;
            height: 120px;
            perspective: 600px;
            z-index: 20;
        }

        .side-mirror-left-pos { left: 15px; }
        .side-mirror-right-pos { right: 15px; }

        .side-mirror-housing {
            width: 100%;
            height: 100%;
            background: #000;
            border: 3px solid var(--hud-cyan);
            border-radius: 28px;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('Ball tükör terv.png');
            background-size: 350%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .side-mirror-container.side-mirror-right-pos .side-mirror-housing {
            background-image: url('Jobb tükör terv.png');
            background-size: 350%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .mirror-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.04s ease-out;
        }

        /* SZÉLVEDŐ ÚJ HÁTTÉRREL (Szélvédőre 2.png) */
        .windshield-frame {
            width: 82%;
            height: 440px;
            background-image: linear-gradient(to bottom, rgba(3, 7, 18, 0.2), rgba(3, 7, 18, 0.4)), url('Szélvédőre%202.png');
            background-size: cover;
            background-position: center;
            image-rendering: -webkit-optimize-contrast;
            border: 3px solid rgba(0, 243, 255, 0.6);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,243,255,0.25);
        }

        .projected-hud-overlay {
            position: absolute;
            bottom: 25px;
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .hud-main-data {
            display: flex;
            align-items: baseline;
            gap: 12px;
            text-shadow: 0 0 15px var(--hud-cyan);
            font-family: monospace;
        }

        .hud-speed {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .hud-unit-time {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: var(--hud-cyan);
            font-weight: bold;
        }

        .hud-alignment-bar {
            width: 130px;
            height: 6px;
            background: var(--hud-green);
            border-radius: 4px;
            margin-top: 5px;
            box-shadow: 0 0 15px var(--hud-green);
        }

        .smart-windshield-hud {
            position: absolute;
            width: 92%;
            top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }

        .speedo-display {
            color: var(--hud-cyan);
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--hud-cyan);
        }

        .angle-hud {
            color: var(--hud-green);
            font-size: 0.95rem;
            font-weight: bold;
            text-align: right;
            background: rgba(2, 6, 23, 0.85);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            text-shadow: 0 0 8px var(--hud-green);
        }

        .mirror-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 15;
            margin-top: 5px;
        }

        .mirror-housing-center {
            width: 350px;
            height: 110px;
            background: #000;
            border: 3px solid var(--hud-cyan);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            perspective: 700px;
            z-index: 2;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
            background-image: url('Középső tükör terv.png');
            background-size: 320%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .mirror-inner-glass {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .target-reticle {
            position: absolute;
            z-index: 5;
            width: 150px;
            height: 55px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            background: rgba(2, 6, 23, 0.75);
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
        }

        /* KÜLSŐ SÁV A SZEMEKNEK ÉS STATUSZNAK */
        .external-footer-bar {
            width: 82%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .head-tracker-stage {
            width: 100px;
            height: 50px;
            perspective: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .head-3d {
            width: 50px;
            height: 42px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #0f172a);
            border: 2px solid var(--hud-cyan);
            border-radius: 20px 20px 25px 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            box-shadow: 0 0 15px rgba(0,243,255,0.3);
        }

        .eye-sensor {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border: 2px solid var(--hud-cyan);
            border-radius: 50%;
            position: absolute;
            top: 12px;
            transition: transform 0.04s ease-out;
        }

        .eye-left { left: 10px; }
        .eye-right { right: 10px; }

        .pupil-3d {
            width: 5px;
            height: 5px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .mirror-adjust-hud {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0,243,255,0.25);
        }

        .status-icon {
            width: 20px;
            height: 12px;
            background: var(--hud-cyan);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>AION Matrix Lab - Crystal HUD 2</p>
    </div>

    <div class="cockpit-container" id="cabin">

        <!-- BAL KÜLSŐ TÜKÖR -->
        <div class="side-mirror-container side-mirror-left-pos">
            <div class="side-mirror-housing" id="leftMirrorHousing">
                <div class="mirror-canvas" id="leftMirrorContent"></div>
            </div>
        </div>

        <div class="windshield-frame">
            
            <div class="projected-hud-overlay">
                <div class="hud-main-data">
                    <span class="hud-speed" id="hudSpeed">28</span>
                    <div class="hud-unit-time">
                        <span>KM/H</span>
                        <span id="hudClock">22:57</span>
                    </div>
                </div>
                <div class="hud-alignment-bar"></div>
            </div>

            <div class="smart-windshield-hud">
                <div class="speedo-display"><span id="speedVal">28</span> KM/H</div>
                <div class="angle-hud">
                    <div>L-ANG: <span id="langVal">32°</span></div>
                    <div>R-ANG: <span id="rangVal">24°</span></div>
                </div>
            </div>

            <!-- KÖZÉPSŐ TÜKÖR -->
            <div class="mirror-wrapper">
                <div class="mirror-housing-center" id="centerMirrorHousing">
                    <div class="mirror-inner-glass" id="mirrorGlass">
                        <div class="mirror-canvas" id="centerMirrorContent"></div>
                        <div class="target-reticle" id="reticle">
                            tracking...
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- KÜLSŐ SÁV A SZEMEKNEK -->
        <div class="external-footer-bar">
            <div class="mirror-adjust-hud">
                <div class="status-icon"></div>
                <div>
                    <div>Current: <span id="currVal">32°</span></div>
                    <div>Target: <span id="rangValText">24°</span></div>
                </div>
            </div>

            <div class="head-tracker-stage">
                <div class="head-3d" id="head3d">
                    <div class="eye-sensor eye-left"><div class="pupil-3d" id="pupilL"></div></div>
                    <div class="eye-sensor eye-right"><div class="pupil-3d" id="pupilR"></div></div>
                </div>
            </div>
        </div>

        <!-- JOBB KÜLSŐ TÜKÖR -->
        <div class="side-mirror-container side-mirror-right-pos">
            <div class="side-mirror-housing" id="rightMirrorHousing">
                <div class="mirror-canvas" id="rightMirrorContent"></div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const head3d = document.getElementById('head3d');
        const pupilL = document.getElementById('pupilL');
        const pupilR = document.getElementById('pupilR');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const centerMirrorHousing = document.getElementById('centerMirrorHousing');
        const leftMirrorHousing = document.getElementById('leftMirrorHousing');
        const rightMirrorHousing = document.getElementById('rightMirrorHousing');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const currVal = document.getElementById('currVal');
        const rangValText = document.getElementById('rangValText');
        const speedVal = document.getElementById('speedVal');
        const hudSpeed = document.getElementById('hudSpeed');
        const hudClock = document.getElementById('hudClock');

        setInterval(() => {
            const currentSpeed = 27 + Math.floor(Math.random() * 3);
            speedVal.innerText = currentSpeed;
            hudSpeed.innerText = currentSpeed;

            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hudClock.innerText = `${hours}:${minutes}`;
        }, 1500);

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            const headRotY = (x / (rect.width / 2)) * 30;
            const headRotX = -(y / (rect.height / 2)) * 20;
            head3d.style.transform = `rotateY(${headRotY}deg) rotateX(${headRotX}deg)`;

            const px = (x / (rect.width / 2)) * 3;
            const py = (y / (rect.height / 2)) * 3;
            pupilL.style.transform = `translate(${px}px, ${py}px)`;
            pupilR.style.transform = `translate(${px}px, ${py}px)`;

            const rotY = (x / (rect.width / 2)) * 25;
            const rotX = -(y / (rect.height / 2)) * 20;
            const shiftX = (x / (rect.width / 2)) * 10;

            mirrorGlass.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateX(${shiftX}px)`;
            centerMirrorHousing.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;

            leftMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;
            rightMirrorHousing.style.transform = `rotateY(${rotY * 0.7}deg) rotateX(${rotX * 0.5}deg)`;

            const currentAng = Math.round(32 + (x / 20));
            const targetAng = Math.round(24 + (y / 20));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            rangValText.innerText = `${targetAng}°`;

            if (Math.abs(x) < 60 && Math.abs(y) < 60) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
