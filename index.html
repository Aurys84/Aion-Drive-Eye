<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Drive-Eye v1.1.0 - Real Cockpit View</title>
    <style>
        :root {
            --hud-green: #22c55e;
            --hud-cyan: #00f3ff;
            --bg-dark: #030712;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 8px; }
        h1 { color: var(--hud-cyan); margin: 0; font-size: 1.7rem; text-shadow: 0 0 15px var(--hud-cyan); letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 0.85rem; margin-top: 2px; }

        /* JÁRMŰ KABIN ÉS UTAS TÉR ORSZÁGÚTI HÁTTÉRREL */
        .cabin-view {
            width: 98%;
            max-width: 850px;
            height: 540px;
            /* Stylized éjszakai országút háttér */
            background: 
                perspective(200px) rotateX(25deg) linear-gradient(0deg, rgba(0,243,255,0.05) 2px, transparent 2px),
                radial-gradient(ellipse at 50% 60%, rgba(15, 23, 42, 0.4) 0%, #020617 90%),
                linear-gradient(180deg, #090d16 0%, #1e293b 60%, #020617 100%);
            background-size: 40px 40px, 100% 100%, 100% 100%;
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0,243,255,0.15);
        }

        /* ORSZÁGÚTI SÁVOK A SZÉLVEDŐ MÖGÖTT */
        .road-perspective {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
        }

        .road-lane {
            width: 180px;
            height: 100%;
            border-left: 4px dashed rgba(255, 255, 255, 0.25);
            border-right: 4px dashed rgba(255, 255, 255, 0.25);
            transform: perspective(300px) rotateX(60deg);
        }

        .windshield-hud {
            position: absolute;
            top: 20px;
            right: 30px;
            font-family: monospace;
            color: var(--hud-green);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: right;
            text-shadow: 0 0 10px var(--hud-green);
            pointer-events: none;
            line-height: 1.5;
            z-index: 10;
        }

        /* FENTI TÜKÖR KONZOL */
        .mirror-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
            margin-top: 5px;
        }

        .mirror-stem {
            width: 16px;
            height: 25px;
            background: linear-gradient(90deg, #0f172a, #334155, #0f172a);
            border: 1px solid #475569;
            box-shadow: 0 0 10px #000;
            border-radius: 4px;
            margin-bottom: -5px;
            z-index: 1;
        }

        .mirror-housing {
            width: 380px;
            height: 140px;
            background: #020617;
            border: 5px solid #1e293b;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px #000, 0 15px 35px rgba(0,0,0,0.85);
            perspective: 700px;
            z-index: 2;
        }

        .mirror-inner-glass {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,243,255,0.25), transparent 65%),
                linear-gradient(rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .target-reticle {
            width: 190px;
            height: 75px;
            border: 2px dashed var(--hud-cyan);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-cyan);
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
            text-transform: lowercase;
            transform: translateZ(30px);
        }

        /* ALULRA HELYEZETT BIOMETRIKUS FEJ / TEKINTET */
        .head-tracker-stage {
            width: 120px;
            height: 110px;
            perspective: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            margin-bottom: 10px;
        }

        .head-3d {
            width: 80px;
            height: 95px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #0f172a);
            border: 2px solid var(--hud-cyan);
            border-radius: 40px 40px 50px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transition: transform 0.04s ease-out;
            transform-style: preserve-3d;
        }

        .eye-sensor {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 3px solid var(--hud-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--hud-cyan);
            position: absolute;
            top: 32px;
            transition: transform 0.04s ease-out;
        }

        .eye-left { left: 18px; }
        .eye-right { right: 18px; }

        .pupil-3d {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            left: 6px;
        }

        .mirror-adjust-hud {
            position: absolute;
            bottom: 20px;
            left: 25px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0,243,255,0.25);
            z-index: 10;
        }

        .status-icon {
            width: 26px;
            height: 16px;
            background: var(--hud-cyan);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--hud-cyan);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aion Drive-Eye v1.1.0</h1>
        <p>AION Matrix Lab - Real Cockpit View & Optical Tracking</p>
    </div>

    <div class="cabin-view" id="cabin">
        
        <div class="road-perspective">
            <div class="road-lane"></div>
        </div>

        <div class="windshield-hud">
            <div>L-ANG: <span id="langVal">15°</span></div>
            <div>R-ANG: <span id="rangVal">18°</span></div>
        </div>

        <!-- 1. FENTI TÜKÖR -->
        <div class="mirror-wrapper">
            <div class="mirror-stem"></div>
            <div class="mirror-housing">
                <div class="mirror-inner-glass" id="mirrorGlass">
                    <div class="target-reticle" id="reticle">
                        user verified
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. ALULI TEKINTET / FEJ TRACKER -->
        <div class="head-tracker-stage">
            <div class="head-3d" id="head3d">
                <div class="eye-sensor eye-left"><div class="pupil-3d" id="pupilL"></div></div>
                <div class="eye-sensor eye-right"><div class="pupil-3d" id="pupilR"></div></div>
            </div>
        </div>

        <div class="mirror-adjust-hud">
            <div class="status-icon"></div>
            <div>
                <div>Current: <span id="currVal">15°</span></div>
                <div>Target: <span id="targVal">18°</span></div>
            </div>
        </div>

    </div>

    <script>
        const cabin = document.getElementById('cabin');
        const head3d = document.getElementById('head3d');
        const pupilL = document.getElementById('pupilL');
        const pupilR = document.getElementById('pupilR');
        const mirrorGlass = document.getElementById('mirrorGlass');
        const reticle = document.getElementById('reticle');
        const langVal = document.getElementById('langVal');
        const rangVal = document.getElementById('rangVal');
        const currVal = document.getElementById('currVal');
        const targVal = document.getElementById('targVal');

        function processMotion(clientX, clientY) {
            const rect = cabin.getBoundingClientRect();
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            const headRotY = (x / (rect.width / 2)) * 35;
            const headRotX = -(y / (rect.height / 2)) * 25;
            head3d.style.transform = `rotateY(${headRotY}deg) rotateX(${headRotX}deg)`;

            const px = (x / (rect.width / 2)) * 5;
            const py = (y / (rect.height / 2)) * 5;
            pupilL.style.transform = `translate(${px}px, ${py}px)`;
            pupilR.style.transform = `translate(${px}px, ${py}px)`;

            const rotY = (x / (rect.width / 2)) * 30;
            const rotX = -(y / (rect.height / 2)) * 24;
            const shiftX = (x / (rect.width / 2)) * 14;

            mirrorGlass.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateX(${shiftX}px)`;

            const currentAng = Math.round(15 + (x / 22));
            const targetAng = Math.round(18 + (y / 22));

            langVal.innerText = `${currentAng}°`;
            rangVal.innerText = `${targetAng}°`;
            currVal.innerText = `${currentAng}°`;
            targVal.innerText = `${targetAng}°`;

            if (Math.abs(x) < 60 && Math.abs(y) < 60) {
                reticle.innerText = "user verified";
                reticle.style.borderColor = "#00f3ff";
                reticle.style.color = "#00f3ff";
            } else {
                reticle.innerText = "tracking...";
                reticle.style.borderColor = "#22c55e";
                reticle.style.color = "#22c55e";
            }
        }

        cabin.addEventListener('mousemove', (e) => processMotion(e.clientX, e.clientY));
        cabin.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                processMotion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
